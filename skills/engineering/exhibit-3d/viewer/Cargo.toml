[package]
name = "exhibit-viewer"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = "2"

[dependencies]
# custom-protocol makes this a release build of Tauri: the Dock shows the bundle's own icon.
tauri = { version = "2", features = ["custom-protocol"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSControl", "NSButton", "NSWindow"] }
